<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js Conf — afterparty</title>
<meta name="description" content="The Three.js Conf afterparty, with the badge's disco ball dropping in. Made to be embedded in an iframe.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
 @font-face{font-family:Dingos;src:url('assets/DingosBlack.otf');font-display:block}
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;overflow:hidden;background:linear-gradient(#211c3b 0%,#2b2549 38%,#3b3568 66%,#726caf 100%)}
 /* The composition keeps the frame's proportions and centres itself in the iframe. */
 #poster{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(100%,calc(100vh * 1028 / 990));height:min(100%,calc(100vw * 990 / 1028));container-type:size}
 .ph,#ball,.title{position:absolute;display:block}
 .ph{object-fit:cover;border-radius:.6cqw;box-shadow:0 1.4cqw 3.4cqw rgba(12,8,30,.42);will-change:transform,translate;
  transition:scale .55s cubic-bezier(.22,.9,.28,1),box-shadow .55s ease,opacity .75s ease}
 body.in .ph:hover{scale:1.035;box-shadow:0 2.4cqw 5cqw rgba(12,8,30,.5)}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.1cqw)}}
 .rooftop{--dur:9.5s;--ph:-1.2s;left:11.576%;top:19.548%;width:37.354%;height:29.091%}
 .sign{--dur:8.2s;--ph:-3.4s;left:59.436%;top:34.117%;width:27.626%;height:29.091%}
 .bar{--dur:10.4s;--ph:-5.1s;left:3.696%;top:53.309%;width:50%;height:35.253%}
 .crew{--dur:8.8s;--ph:-2.2s;left:59.436%;top:68.182%;width:39.202%;height:28.889%}
 .title{left:0;top:9.168%;width:100%;height:12.323%;fill:#fea5fc;font-family:Dingos,'Arial Black',sans-serif}
 #ball{inset:0;width:100%;height:100%;touch-action:pan-y}
 /* Everything arrives once the block is actually on screen, then the ball drops in. */
 .ph{opacity:0;scale:.985}
 .title .ltr{opacity:0;translate:0 18%;rotate:-7deg;scale:.8;transform-box:fill-box;transform-origin:50% 90%;
  transition:opacity .45s ease var(--d),translate .85s cubic-bezier(.2,1.35,.3,1) var(--d),rotate .85s cubic-bezier(.2,1.35,.3,1) var(--d),scale .85s cubic-bezier(.2,1.35,.3,1) var(--d);--d:calc(var(--i,0) * 55ms)}
 body.in .title .ltr{opacity:1;translate:0 0;rotate:0deg;scale:1}
 .title:not(:has(.ltr)){opacity:0;transition:opacity .7s ease}
 body.in .title:not(:has(.ltr)){opacity:1}
 body.in .ph{opacity:1;scale:1;animation:float var(--dur,9s) ease-in-out var(--ph,0s) infinite}
 body.in .rooftop{transition-delay:.16s}
 body.in .sign{transition-delay:.24s}
 body.in .bar{transition-delay:.32s}
 body.in .crew{transition-delay:.4s}
 body.in @media(prefers-reduced-motion:reduce){.ph,.title{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div id="poster">
 <svg class="title" viewBox="0 0 1028 122" aria-label="Partyyyy"><text x="514" y="112" text-anchor="middle" textLength="952" lengthAdjust="spacingAndGlyphs" font-size="122">PARTYYYY</text></svg>
 <img class="ph rooftop" src="assets/party/rooftop.jpg" alt="The rooftop of the Fluctuart barge during Three.js Conf" width="768" height="576">
 <img class="ph sign" src="assets/party/sign.jpg" alt="The Three Conf Party sign above the Seine" width="568" height="576">
 <img class="ph bar" src="assets/party/bar.jpg" alt="The party bar, wrapped in the Three Conf disco ball artwork" width="1028" height="698">
 <img class="ph crew" src="assets/party/crew.jpg" alt="The crew in front of the THREE.JS letters" width="806" height="572">
 <canvas id="ball" aria-hidden="true"></canvas>
</div>
<script src="embed-party.js?v=75"></script>
</body>
</html>

<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreeJS Conf badge — 3D view</title>
<meta name="description" content="The assembled ThreeJS Conf speaker badge in 3D, running its real firmware. Made to be embedded in an iframe.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
 @font-face{font-family:Dingos;src:url('assets/DingosBlack.otf');font-display:block}
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;background:#d6d5f9;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#7a7284}
 #scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
 #scene:active{cursor:grabbing}
 #scene:focus-visible{outline:3px solid #7853d5;outline-offset:-3px}
 #loading{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.06em;transition:opacity .5s ease;pointer-events:none}
 #loading.hidden{opacity:0}
 #loading.error{pointer-events:auto;padding:0 8%;text-align:center;line-height:1.6}
 /* Nothing says "3D" on its own: a hand that swipes until the visitor does. */
 #hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:8px 15px 8px 11px;border-radius:999px;background:#fffffff0;box-shadow:0 8px 22px #2a1f3a1c;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#5d5570;white-space:nowrap;pointer-events:none;opacity:0;animation:hint-in .7s ease 1s forwards}
 #hint.gone{animation:none;opacity:0;transform:translateX(-50%) translateY(7px);transition:opacity .45s ease,transform .45s ease}
 @keyframes hint-in{to{opacity:1}}
 #hint svg{width:19px;height:19px;stroke:#6b6280;fill:none;animation:hint-swipe 2.9s cubic-bezier(.45,0,.2,1) infinite}
 @keyframes hint-swipe{0%,10%{transform:translateX(0) rotate(0)}30%{transform:translateX(-5px) rotate(-12deg)}62%{transform:translateX(5px) rotate(12deg)}82%,100%{transform:translateX(0) rotate(0)}}
 #hint .sm{display:none}
 @media(max-width:430px){#hint{font-size:9px;padding:7px 12px 7px 9px}#hint .lg{display:none}#hint .sm{display:inline}}
 @media(prefers-reduced-motion:reduce){#hint{animation:none;opacity:1}#hint svg{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="3D model of the assembled Three.js Conf speaker badge. Click a button to use it."></canvas>

</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreeJS Conf badge — 3D view</title>
<meta name="description" content="The assembled ThreeJS Conf speaker badge in 3D, running its real firmware. Made to be embedded in an iframe.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
 @font-face{font-family:Dingos;src:url('assets/DingosBlack.otf');font-display:block}
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;background:#d6d5f9;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#7a7284}
 #scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
 #scene:active{cursor:grabbing}
 #scene:focus-visible{outline:3px solid #7853d5;outline-offset:-3px}
 #loading{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.06em;transition:opacity .5s ease;pointer-events:none}
 #loading.hidden{opacity:0}
 #loading.error{pointer-events:auto;padding:0 8%;text-align:center;line-height:1.6}
/* Nothing says "3D" on its own. The chip rides the badge's shoulder in its own yellow,
    says what to do for a few seconds, then folds back to a pulsing dot. */
 #hint{--s:clamp(52px,8.4vmin,70px);position:absolute;left:0;top:0;height:var(--s);
  transform:translate(var(--x,50%),var(--y,50%)) translate(calc(var(--s) / -2),calc(var(--s) / -2));
  display:flex;align-items:center;border-radius:999px;background:#f2d22f;color:#251d3a;
  box-shadow:0 .6vmin 2.2vmin rgba(42,31,58,.38),0 0 0 .35vmin rgba(255,255,255,.75);
  pointer-events:none;opacity:0;scale:.75;transition:opacity .45s ease,scale .55s cubic-bezier(.34,1.3,.36,1)}
 body.hinting #hint{opacity:1;scale:1}
 #hint::after{content:'';position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:50%;
  border:.3vmin solid #f2d22f;animation:hint-pulse 2.2s cubic-bezier(.3,0,.2,1) infinite}
 @keyframes hint-pulse{0%{transform:scale(.94);opacity:1}70%,100%{transform:scale(1.45);opacity:0}}
 #hint svg{width:var(--s);height:var(--s);padding:calc(var(--s) * .27);stroke:#251d3a;fill:none;flex:none;
  animation:hint-swipe 2.9s cubic-bezier(.45,0,.2,1) infinite}
 @keyframes hint-swipe{0%,10%{transform:translateX(0) rotate(0)}30%{transform:translateX(-14%) rotate(-12deg)}62%{transform:translateX(14%) rotate(12deg)}82%,100%{transform:translateX(0) rotate(0)}}
 #hint b{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;font:700 calc(var(--s) * .23)/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.08em;text-transform:uppercase;transition:max-width .55s cubic-bezier(.22,.9,.28,1),opacity .35s ease,padding .55s cubic-bezier(.22,.9,.28,1)}
 body.hint-open #hint b{max-width:14em;opacity:1;padding-right:calc(var(--s) * .34)}
 @media(prefers-reduced-motion:reduce){#hint svg,#hint::after{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="3D model of the assembled Three.js Conf speaker badge. Click a button to use it."></canvas>
<div id="loading" role="status">Unpacking the badge…</div>
<div id="hint" role="img" aria-label="Drag to turn the badge, and tap its buttons"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 11.5V4.2a1.8 1.8 0 1 1 3.6 0v7.3"/><path d="M14.6 12.2v-1a1.7 1.7 0 0 1 3.4 0v4.3a5.5 5.5 0 0 1-5.5 5.5h-1.4a5.5 5.5 0 0 1-4.1-1.9l-2.5-2.9a1.7 1.7 0 0 1 2.4-2.4l1.7 1.6"/></svg><b>Drag to turn</b></div>
<script type="module" src="embed.js?v=74"></script>
</body>
</html>
